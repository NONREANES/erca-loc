<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#e6eef4"/></linearGradient>
    <linearGradient id="tela1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2340"/><stop offset=".6" stop-color="#0d4a6b"/><stop offset="1" stop-color="#00B4B3"/></linearGradient>
    <linearGradient id="tela2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc6e6"/><stop offset=".5" stop-color="#127a9a"/><stop offset="1" stop-color="#0B2340"/></linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4452"/><stop offset=".5" stop-color="#1c232c"/><stop offset="1" stop-color="#3a4452"/></linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#0B2340" flood-opacity=".25"/></filter>
  </defs>
  
  
  <!-- celular de trás -->
  <g transform="translate(640 150) rotate(9)" filter="url(#sombra)">
    <rect width="270" height="560" rx="42" fill="url(#corpo)"/>
    <rect x="12" y="12" width="246" height="536" rx="32" fill="url(#tela2)"/>
    <rect x="105" y="26" width="60" height="16" rx="8" fill="#0b0f14"/>
    <g fill="#fff" fill-opacity=".9"><rect x="40" y="110" width="120" height="16" rx="8"/><rect x="40" y="140" width="80" height="12" rx="6" fill-opacity=".6"/></g>
    <g fill="#fff" fill-opacity=".18"><rect x="40" y="200" width="190" height="90" rx="18"/><rect x="40" y="305" width="90" height="90" rx="18"/><rect x="140" y="305" width="90" height="90" rx="18"/></g>
  </g>
  <!-- celular da frente -->
  <g transform="translate(330 120) rotate(-6)" filter="url(#sombra)">
    <rect width="300" height="620" rx="46" fill="url(#corpo)"/>
    <rect x="13" y="13" width="274" height="594" rx="35" fill="url(#tela1)"/>
    <rect x="118" y="28" width="64" height="18" rx="9" fill="#0b0f14"/>
    <!-- símbolo ERCA LOC na tela -->
    <g transform="translate(95 200) scale(1.1)" fill="none" stroke-width="11">
      <path d="M74 22 L50 8 L13 29 L13 71 L26 78.5" stroke="#F7A21B"/>
      <path d="M26 78 L50 92 L87 71 L87 29 L80 25" stroke="#1E88E5"/>
      <path d="M70 36 L50 25 L31 36 L31 50 L50 50 L69 50 L69 64 L50 75 L36 67" stroke="#2EC4E6"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="800" font-size="34" text-anchor="middle">
      <text x="150" y="375" fill="#fff">ERCA <tspan fill="#2EC4E6">LOC</tspan></text>
    </g>
    <text x="150" y="405" fill="#fff" fill-opacity=".7" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">LOCAÇÃO DE TECNOLOGIA</text>
    <rect x="110" y="575" width="80" height="6" rx="3" fill="#fff" fill-opacity=".5"/>
  </g>
</svg>
